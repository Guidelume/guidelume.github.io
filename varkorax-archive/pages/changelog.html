<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="../../engine/js/image-fallbacks.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noai, noimageai, noindex, nofollow" />
        
        <title>| Changelog</title>
        <link rel="shortcut icon" type="image/x-icon" data-link="../custom/favicon.svg" />
        
        <link rel="stylesheet" href="../custom/css/global.css" />
        <link rel="stylesheet" href="../custom/css/writing.css" />
        <!-- Manual Override (yes this'll go into its own file once I am done) -->
        <style>
		/* =
		   Global Text Override
		   = */

		.content h1,
		.content h2,
		.content p {
			color: #fff !important;
		}
		
		#changelog-content {
			color: #fff !important;
		}
		
		/* =
		   Story Button
		   = */
		
		.story-btn {
			display: inline-block;

			padding: 0.55rem 1.1rem;

			border: 1px solid var(--surface-border);
			border-radius: 0.75rem;

			background: var(--surface-bg);

			color: var(--surface-color);
			backdrop-filter: var(--surface-backdrop);
			-webkit-backdrop-filter: var(--surface-backdrop);
			box-shadow: var(--surface-shadow);
			text-decoration: none;
			font-weight: 600;

			transition:
				transform 0.2s ease,
				background 0.2s ease,
				border-color 0.2s ease;

			transform: translateZ(0);
			backface-visibility: hidden;
		}

		.story-btn:hover {
			background: var(--surface-hover-bg);
			border-color: var(--surface-hover-border);

			transform: translateY(-2px);
		}
		
		.story-btn:disabled,
		.story-btn.disabled {
			opacity: 0.45;
			cursor: default;
			pointer-events: none;
		}
		
		/* =
		   Tooltips
		   = */

		[data-tooltip]::before,
		.topbar-btn:hover[data-tooltip]::before,
		.infobar-btn:hover[data-tooltip]::before {
			font-family: "Lexend", sans-serif;
		}

		/* =
		   Navigation Buttons
		   = */

		.panel-glyph {
			width: 32px;
			height: 32px;
			margin-right: .4rem;
			vertical-align: middle;
		}

		/* =
		   Footer
		   = */

		.footer-wrapper {
			position: fixed;

			right: 64px;
			bottom: 0;

			display: flex;
			justify-content: flex-end;
			align-items: flex-end;

			width: auto;
			height: 128px;

			overflow: hidden;

			pointer-events: none;

			z-index: 4;

			font-family: "Lexend", sans-serif;
		}

		.footer-box {
			display: inline-block;

			padding: 8px 12px;

			border: 1px solid rgba(255,255,255,0.06);
			border-radius: 12px 12px 0 0;

			background: rgba(7,12,20,0.36);

			backdrop-filter: blur(6px) saturate(110%);
			-webkit-backdrop-filter: blur(6px) saturate(110%);

			box-shadow: 0 8px 22px rgba(0,0,0,0.45);

			color: #fff;
			font-size: 0.92em;
			white-space: nowrap;

			pointer-events: auto;

			transition: transform 320ms ease;
		}

		.footer-heart,
		.footer-name {
			display: inline-block;

			color: #ff984a;

			transform-origin: center;
			will-change: transform, color;

			animation: footerPulse 1.6s ease-in-out infinite;
		}

		.footer-name {
			margin-left: 6px;
			animation-duration: 1.9s;
		}
		
		@keyframes footerPulse {
			0% {
				transform: scale(1);
				color: #ff9a4a;
			}

			45% {
				transform: scale(1.04);
				color: #ff7a2e;
			}

			100% {
				transform: scale(1);
				color: #ff9a4a;
			}
		}

		/* =
		   Animations
		   = */

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(18px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* =
		   Reduced Motion
		   = */

		@media (prefers-reduced-motion: reduce) {

			.footer-heart,
			.footer-name {
				animation: none;
			}

			.story-btn,
			.topbar-btn {
				transition: none;
			}
		}

		/* =
		   Mobile
		   = */

		@media (max-width: 700px) {

			.footer-wrapper {
				right: 12px;
				height: 84px;
			}

			.footer-box {
				margin-bottom: -30px;

				padding: 6px 10px;

				border-radius: 10px 10px 0 0;
			}
			
		}
        </style>
    	<link rel="stylesheet" href="../../engine/css/accessible-fonts.css" />
	<script src="../../engine/js/font-accessibility.js" defer></script>
</head>

    <body>
        <!-- Changing Background -->
        <div id="background">
            <div class="bg-layer" id="bg1"></div>
            <div class="bg-layer" id="bg2"></div>
        </div>
		
		<!-- Floating back button I shamelessly stole from Categories -->
		<a
			href="../index.html"
			class="story-btn"
			id="back-to-categories"
			style="margin-left: 60px"
			data-tooltip="Return"
			aria-label="Return"
		>
			<span class="back-text" style="font-family: 'Lexend'" aria-hidden="false">Return</span>
		</a>
		
        <!-- Top-left navigation -->
        <nav id="topbar" aria-label="Primary">
			<!-- Home Button disabled -->
			<button
				class="topbar-btn"
				aria-current="page"
				aria-label="Home"
				disabled
			>
                <img data-src="../custom/img/side-home.png" alt="Home" />
            </button>
			
		</nav>
		
        <!-- Main content -->
		<main class="content" id="main-content" style="font-family: 'Lexend'">

			<div class="readable-panel" style="font-family:'Lexend';">

			<h2 id="version-title">Loading…</h2>

			<p id="version-date"></p>

			<hr>

			<div id="changelog-content">
				Loading changelog...
			</div>

			<div style="margin-top:2rem; display:flex; justify-content:space-between; gap:1rem;">
				<button id="prev-log" class="story-btn">
					← Previous
				</button>

				<button id="next-log" class="story-btn">
					Next →
				</button>
			</div>

		</div>

		</main>
        
        <!-- Infobar (top-right) -->
        <nav id="infobar" aria-label="Site utilities">
			<!-- Settings button -->
            <button
                id="settings-toggle"
                class="infobar-btn"
                aria-expanded="false"
                aria-controls="time-of-day-menu"
                data-tooltip="Time of day"
                >
                <img data-src="../custom/img/bottom-gear.png" alt="Time of day" id="settings-icon" />
            </button>
            
            <div class="infobar-sep" aria-hidden="true"></div>
			
			<!-- Social Button -->
            <a id="social-link" class="infobar-btn" href="https://bsky.app/profile/varkorax.bsky.social" aria-label="Visit Varkorax on Bluesky" data-tooltip="Socials"><img data-src="custom/img/side-social-bsky.png" alt="Socials" id="notif-icon" /></a>
			
			<!-- Credits Button -->
            <button
                id="info-toggle"
                class="infobar-btn"
                aria-expanded="false"
                aria-controls="info-popup"
                data-tooltip="Info"
                >
                <img data-src="../custom/img/bottom-info.png" alt="Info" id="info-icon" />
            </button>
        </nav>
        
        <!-- SETTINGS POPUP (inlined) -->
        

        <!-- INFO POPUP (inlined) -->
        <div id="info-popup" class="popup" role="dialog" aria-hidden="true" aria-label="Info panel" aria-modal="true">
            <div class="popup-inner">
                <button class="popup-start visually-hidden" aria-label="Start of info dialog">Start info</button>
                <button class="popup-close" aria-label="Close info panel">✕</button>

                <div class="popup-content">
                    <!-- IFRAME: info page -->
                    <iframe
                        src="./info.html"
                        title="Info"
                        style="display:block; width:100%; height:100%; min-height:320px; border:0;"
                        allow="clipboard-read; clipboard-write; geolocation; microphone; camera; autoplay"
                        ></iframe>

                    <noscript>
                        <div class="content small">
                            <p style="font-family: 'Lexend'">JavaScript is required to load the info panel. <a class="bare-link" href="./info.html">Open info</a></p>
                        </div>
                    </noscript>
                </div>

                <p class="popup-help" style="font-family: 'Lexend'">To close, click outside the window or press Escape.</p>
            </div>
        </div>
        
        <!-- Toast container -->
        <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
        
		<!-- Footer Footer Footer Footlong -->
		<div class="footer-wrapper" aria-hidden="false">
			<div class="footer-box" role="contentinfo">
				Made with <span class="footer-heart">♥</span> by<span class="footer-name"><a href="https://www.youtube.com/watch?v=Q2vA4Ue4Ths" target="_blank" rel="noopener" style="color:inherit; text-decoration:none;">Varkorax</a></span>
			</div>
		</div>
		
        <!-- Global JS -->
        <script src="../custom/js/global.js" defer></script>
		
		<!-- Markdown parser + DOMPurify -->
		<script src="../../engine/external/marked/18.0.5/marked.umd.js" integrity="sha512-eYhVvgK6+HzGzZYdrMauPoXufKz0jNWSvBEj2yWkM5My9btV3cwRWylUnLDrhGM9HWpRKMaQvV251rUPt9Yo9g==" crossorigin="anonymous"></script>
		<script src="../../engine/external/dompurify/3.4.18/purify.min.js" integrity="sha512-rdR9GuV0xLpA0LBDRiu2Ei3wOgPbvzJIc7elYsvuRj9T/vdhXfJr9mcC8xoyuXoDHyZuisD9CJ6QhdBm48HENg==" crossorigin="anonymous"></script>
		
		<!-- Page script: glue the floating back button under the current topbar button -->
		<script src="../../engine/js/pages/varkorax-archive-pages-changelog-1.js"></script>
		
		<!-- Wiring: Changelog fetching and parsing -->
		<script src="../../engine/js/pages/varkorax-archive-pages-changelog-2.js"></script>
		
    </body>
</html>
