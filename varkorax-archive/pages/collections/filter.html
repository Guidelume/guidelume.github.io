<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noai, noimageai, noindex, nofollow" />
		
		<title>| Filter</title>
		<link rel="shortcut icon" type="image/x-icon" data-link="../../custom/favicon.svg" />
		
		<link rel="stylesheet" href="../../custom/css/filter.css" />
		<link rel="stylesheet" href="../../custom/css/global.css" />
		<!-- Manual Override While Things Are Actively Moving Around -->
		<style>
			.pager {
				color: white;
			}
			* {
				font-family: "Lexend", sans-serif;
			}
			.content h1, h2, p {
				color: #ffffff;
			}
			
			.stories-lead {
				color: #ffffff !important;
			}
			
			[data-tooltip]::before,
			.topbar-btn:hover[data-tooltip]::before,
			.infobar-btn:hover[data-tooltip]::before {
				font-family: 'Lexend', sans-serif;
			}
			
		
		/*
			On scoll navbar gets a semi-transparent soft edged shadow or rather box?
			each side gets its own not one across.
		*/
		
		#topbar {
			position: fixed;
			top: 20px;
			left: 20px;
			display: flex;
			align-items: center;
			gap: 12px;
			z-index: 1000;
		}

		#topbar::before {
			content: "";
			position: absolute;
			inset: -10px;
			border-radius: 28px;

			background: rgba(0, 0, 0, 0.35);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);

			opacity: 0;
			transition: opacity 220ms ease;
			z-index: 0;
		}

		body.scrolled-ui #topbar::before {
			opacity: 1;
		}

		#topbar > * {
			position: relative;
			z-index: 1;
		}
		
		#infobar {
			position: fixed;
			top: 16px;
			right: 16px;
			display: flex;
			align-items: center;
			gap: 12px;
			z-index: 1001;
		}
		
		#infobar::before {
			content: "";
			position: absolute;
			inset: -10px;
			border-radius: 28px;

			background: rgba(0, 0, 0, 0.35);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);

			opacity: 0;
			transition: opacity 220ms ease;
			z-index: 0;
		}

		body.scrolled-ui #infobar::before {
			opacity: 1;
		}

		#infobar > * {
			position: relative;
			z-index: 1;
		}
		
		#infobar::before {
			inset: -8px;
			border-radius: 22px;
		}
		
		#topbar::before {
			box-shadow: 0 12px 30px rgba(0,0,0,0.25);
		}

		#infobar::before {
			box-shadow: 0 10px 24px rgba(0,0,0,0.22);
		}
		
		#backToTop {
			position: fixed;
			right: 20px;
			bottom: 60px;

			width: 64px;
			height: 64px;

			display: flex;
			align-items: center;
			justify-content: center;

			border: 1px solid var(--btn-frost-border);
			border-radius: 999px;
			background: var(--btn-frost-bg);

			backdrop-filter: blur(12px) saturate(160%);
			-webkit-backdrop-filter: blur(12px) saturate(160%);

			box-shadow: 0 10px 30px rgba(0,0,0,.22);

			cursor: pointer;

			/* Hidden state */
			opacity: 0;
			transform: translateX(24px);
			pointer-events: none;

			transition:
				opacity .25s ease,
				transform .25s ease,
				background .18s ease,
				border-color .18s ease;

			z-index: 1000;
		}

		#backToTop.visible {
			opacity: 1;
			transform: translateX(0);
			pointer-events: auto;
		}

		#backToTop:hover {
			transform: translateX(0) translateY(-3px);
			background: rgba(255,255,255,.20);
			border-color: rgba(255,255,255,.48);
		}

		#backToTop img {
			width: 32px;
			height: 32px;
			image-rendering: pixelated;
		}

		/* =
		   Tooltips
		   = */

		[data-tooltip]::before,
		.topbar-btn:hover[data-tooltip]::before,
		.infobar-btn:hover[data-tooltip]::before {
			font-family: "Lexend", sans-serif;
		}

		/* =
		   Navigation Buttons
		   = */
		
		.panel-glyph {
			width: 32px;
			height: 32px;
			margin-right: .4rem;
			vertical-align: middle;
		}

		/* =
		   Footer
		   = */

		.footer-wrapper {
			position: fixed;

			right: 64px;
			bottom: 0;

			display: flex;
			justify-content: flex-end;
			align-items: flex-end;

			width: auto;
			height: 128px;

			overflow: hidden;

			pointer-events: none;

			z-index: 4;

			font-family: "Lexend", sans-serif;
		}

		.footer-box {
			display: inline-block;

			padding: 8px 12px;

			border: 1px solid rgba(255,255,255,0.06);
			border-radius: 12px 12px 0 0;

			background: rgba(7,12,20,0.36);

			backdrop-filter: blur(6px) saturate(110%);
			-webkit-backdrop-filter: blur(6px) saturate(110%);

			box-shadow: 0 8px 22px rgba(0,0,0,0.45);

			color: #fff;
			font-size: 0.92em;
			white-space: nowrap;

			pointer-events: auto;

			transition: transform 320ms ease;
		}

		.footer-heart,
		.footer-name {
			display: inline-block;

			color: #ff984a;

			transform-origin: center;
			will-change: transform, color;

			animation: footerPulse 1.6s ease-in-out infinite;
		}

		.footer-name {
			margin-left: 6px;
			animation-duration: 1.9s;
		}
		
		@keyframes footerPulse {
			0% {
				transform: scale(1);
				color: #ff9a4a;
			}

			45% {
				transform: scale(1.04);
				color: #ff7a2e;
			}

			100% {
				transform: scale(1);
				color: #ff9a4a;
			}
		}

		/* =
		   Animations
		   = */

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(18px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* =
		   Reduced Motion
		   = */

		@media (prefers-reduced-motion: reduce) {

			.footer-heart,
			.footer-name {
				animation: none;
			}

			.story-btn,
			.topbar-btn {
				transition: none;
			}
		}

		/* =
		   Mobile
		   = */

		@media (max-width: 700px) {

			.latest-box {
				min-width: 0;
				min-height: 180px;

				padding: 1rem;
			}

			.latest-text {
				max-width: 100%;
				margin-left: 0;
			}

			.latest-title {
				font-size: 1.35rem;
			}

			.footer-wrapper {
				right: 12px;
				height: 84px;
			}

			.footer-box {
				margin-bottom: -30px;

				padding: 6px 10px;

				border-radius: 10px 10px 0 0;
			}
			
		}
		/* Basement Browser */

		.entry-counter{
			text-align:center;
			margin-top:-12px;
			margin-bottom:25px;
			opacity:.75;
		}

		.basement-browser{

			border-radius:28px;

			overflow:hidden;

			backdrop-filter:blur(12px);

			background:rgba(255,255,255,.06);

			border:1px solid rgba(255,255,255,.12);

			box-shadow:0 10px 35px rgba(0,0,0,.25);

		}

		.browser-toolbar{

			padding:28px;

			background:rgba(0,0,0,.18);

			border-bottom:1px solid rgba(255,255,255,.08);

		}

		.toolbar-top{

			display:flex;

			justify-content:space-between;

			align-items:center;

			gap:20px;

			margin-bottom:20px;

		}

		.search-input{

			flex:1;

			max-width:550px;

			padding:12px 18px;

			border-radius:16px;

			border:none;

			font-size:1rem;

		}

		.toolbar-right{

			display:flex;

			align-items:center;

			gap:10px;

		}

		.toolbar-right button{

			width:42px;

			height:42px;

			border:none;

			border-radius:12px;

			cursor:pointer;

		}

		.toolbar-bottom{

			display:grid;

			grid-template-columns:repeat(5,1fr);

			gap:18px;

		}

		.toolbar-bottom select,
		.toolbar-right select{

			padding:10px 14px;

			border:none;

			border-radius:12px;

		}

		.browser-grid{

			padding:35px;

			display:grid;

			grid-template-columns:repeat(5,1fr);

			gap:32px;

			background:rgba(255,255,255,.03);

		}
		
		.archive-card{

			position:relative;

			overflow:hidden;

			border-radius:14px;

			aspect-ratio:.70;

			display:block;

			text-decoration:none;

		}

		.archive-card img{

			width:100%;
			height:100%;

			object-fit:cover;

			transition:.3s;

		}

		.archive-overlay{
			
			position:absolute;

			inset:0;

			display:flex;

			flex-direction:column;

			justify-content:flex-end;

			padding:18px;

			opacity:0;

			color:white;

			background:rgba(0,0,0,.45);
			
			border-radius:14px;

			backdrop-filter:blur(10px);

			transition:.3s;

		}

		.archive-card:hover img{

			transform:scale(1.05);

			filter:blur(5px);

		}

		.archive-card:hover .archive-overlay{

			opacity:1;

		}
		
		.active-filters {

			display: flex;
			flex-wrap: wrap;
			gap: .5rem;
			margin-top: 1rem;

		}

		.filter-pill {

			display: inline-flex;
			align-items: center;

			padding: .35rem .8rem;

			border-radius: 999px;

			cursor: pointer;

		}

		.filter-pill:hover {

			opacity: .8;

		}
		
		.filter-clear {
			
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 128px;
			height: 48px;
			border-radius: 999px;
			background: var(--btn-frost-bg);
			border: 1px solid var(--btn-frost-border);
			backdrop-filter: blur(12px) saturate(160%);
			-webkit-backdrop-filter: blur(12px) saturate(160%);
			box-shadow: 0 10px 30px rgba(0,0,0,0.22);
			transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
			cursor: pointer;
			text-decoration: none;
			-webkit-tap-highlight-color: transparent;
			padding: 8px;
			color: white;
			
		}
		
		.filter-clear:hover {
			transform: translateY(-3px);
			background: rgba(255,255,255,0.20);
			border-color: rgba(255,255,255,0.48);
			box-shadow: 0 14px 36px rgba(0,0,0,0.24);
		}
		
		</style>
	</head>

	<body>
		<!-- Changing Background -->
		<div id="background">
			<div class="bg-layer" id="bg1"></div>
			<div class="bg-layer" id="bg2"></div>
		</div>

		<!-- Top-left navigation -->
        <nav id="topbar" aria-label="Primary">
			<!-- Home -->
			<a
				data-link="../../index.html"
				class="topbar-btn"
				data-tooltip="Home"
				aria-label="Home"
			>
				<img src="../../custom/img/side-home.png" alt="Home" />
			</a>
			
			<div class="topbar-sep" aria-hidden="true"></div>
			
			<!-- Collections (Subsuming Stories and Basement) -->
			<button
				class="topbar-btn"
				aria-label="Collections"
				aria-current="page"
				disabled
			>
				<img data-src="./custom/img/collections.svg" alt="Collections" />
			</button>
			
			<div class="topbar-sep" style="height: 20px" aria-hidden="true"></div>
			
			<!-- Virtual Corkboard -->
            <a
				data-link="./pages/landing_corkboard.html"
				class="topbar-btn"
				data-tooltip="Corkboard"
				aria-label="Corkboard"
			>
                <img data-src="./custom/img/corkboard.svg" alt="Corkboard" />
            </a>
			
            <div class="topbar-sep" aria-hidden="true"></div>
			
			<!-- Modding Guide Mass Effect -->
			<a
				href="https://milkywaybarcrawl.github.io"
				class="topbar-btn"
				style="width: 128px"
				data-tooltip="Milky Way Bar Crawl"
				aria-label="MWBC"
			>
				<img src="../../custom/img/logo-bare-flat.png" style="width: 128px; image-rendering: auto" alt="MWBC" />
			</a>
			
		</nav>
		
		<!-- Floating back button (will be positioned under the button via JS) -->
		<a
			href="../landing_collections.html"
			id="back-to-categories"
			class="topbar-back-btn"
			data-tooltip="Back to Categories"
			aria-label="Back to Categories"
		>
			<span class="back-text" aria-hidden="false">Return to Collections</span>
		</a>
		
		<!-- Main content -->
		<main class="content" id="main-content">
			
			<!-- Actually I can replace this as well depending on the type of content right? -->
			<div id="filter-head" class="readable-panel headline-panel">
			</div>
			
			<!-- OUTER full-width container (the big rounded square) -->
			<div class="readable-panel outer-board">
				
				<section class="basement-browser">
					<div class="browser-toolbar">
						
						<!-- Toolbar WIP -->
						<div class="toolbar-top">
							<input
								id="search"
								type="text"
								class="search-input"
								placeholder="Search collection...">
							
							<p style="justify-content: flex-start">or filter by:</p>
							
							<div class="toolbar-right">
								
								<select id="page-size">	
									<option value="10">10 / Page</option>	
									<option value="20">20 / Page</option>
									<option value="50">50 / Page</option>	
								</select>
								
								<button id="page-prev">&lt;</button>
								<span id="page-label" style="color: white !important">Page 1 / 1</span>
								<button id="page-next">&gt;</button>
								
							</div>
						</div>
						
						<div id="filter-main" class="toolbar-bottom">
							<!-- Injected by Router-Filter -->
						</div>
					</div>
					
					<!-- The actual grid of cards -->
					<div class="browser-grid">
						<!-- Injected by JS -->
					</div>
					
				</section>
			</div>
			
		</main>
		
		<!-- Infobar (top-right) -->
        <nav id="infobar" aria-label="Site utilities">
			<!-- Settings button -->
            <button
                id="settings-toggle"
                class="infobar-btn"
                aria-expanded="false"
                aria-controls="settings-popup"
                data-tooltip="Settings"
                >
                <img data-src="./custom/img/bottom-gear.png" alt="Settings" id="settings-icon" />
            </button>
			
			<div class="infobar-sep" style="height: 20px" aria-hidden="true"></div>
			
			<!-- Credits Button -->
            <button
                id="info-toggle"
                class="infobar-btn"
                aria-expanded="false"
                aria-controls="info-popup"
                data-tooltip="Info"
                >
                <img data-src="./custom/img/bottom-info.png" alt="Info" id="info-icon" />
            </button>
            
			<div class="infobar-sep" aria-hidden="true"></div>
			
			<!-- Social Button -->
            <button
                id="notif-toggle"
                class="infobar-btn"
                aria-expanded="false"
                aria-controls="social-popup"
                data-tooltip="Socials"
                ><a href="https://bsky.app/profile/varkorax.bsky.social">
                <img src="../../custom/img/socials.svg" alt="Socials" id="notif-icon" />
				</a>
            </button>
			
        </nav>

		<!-- SETTINGS POPUP (inlined) -->
		<div id="settings-popup" class="popup" role="dialog" aria-hidden="true" aria-label="Settings panel" aria-modal="true">
			<div class="popup-inner">
				<button class="popup-start visually-hidden" aria-label="Start of settings dialog">Start settings</button>
				<button class="popup-close" aria-label="Close settings panel">✕</button>

				<div class="popup-content">
					<!-- IFRAME: settings page -->
					<iframe
						src="../settings.html"
						title="Settings"
						style="display:block; width:100%; height:100%; min-height:320px; border:0;"
						allow="clipboard-read; clipboard-write; geolocation; microphone; camera; autoplay"
						></iframe>

					<noscript>
						<div class="content small">
							<p>JavaScript is required to load the settings panel. <a class="bare-link" href="./pages/settings.html">Open settings</a></p>
						</div>
					</noscript>
				</div>

				<p class="popup-help">To close, click outside the window or press Escape.</p>
			</div>
		</div>

		<!-- INFO POPUP (inlined) -->
		<div id="info-popup" class="popup" role="dialog" aria-hidden="true" aria-label="Info panel" aria-modal="true">
			<div class="popup-inner">
				<button class="popup-start visually-hidden" aria-label="Start of info dialog">Start info</button>
				<button class="popup-close" aria-label="Close info panel">✕</button>

				<div class="popup-content">
					<!-- IFRAME: info page -->
					<iframe
						src="../info.html"
						title="Info"
						style="display:block; width:100%; height:100%; min-height:320px; border:0;"
						allow="clipboard-read; clipboard-write; geolocation; microphone; camera; autoplay"
						></iframe>

					<noscript>
						<div class="content small">
							<p>JavaScript is required to load the info panel. <a class="bare-link" href="./pages/info.html">Open info</a></p>
						</div>
					</noscript>
				</div>

				<p class="popup-help">To close, click outside the window or press Escape.</p>
			</div>
		</div>

		<!-- Toast container -->
		<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

		<!-- Foot Adjacent Back To Top -->
		<button id="backToTop" aria-label="Back to top">
			<img src="../../custom/img/top.svg" alt="" />
		</button>
		
		<!-- Footer Footer Footer Footlong -->
		<div class="footer-wrapper" aria-hidden="false">
			<div class="footer-box" role="contentinfo">
				Made with <span class="footer-heart">♥</span> by<span class="footer-name"><a href="https://www.youtube.com/watch?v=Q2vA4Ue4Ths" target="_blank" rel="noopener" style="color:inherit; text-decoration:none;">Varkorax</a></span>
			</div>
		</div>
		
		<!-- Beam Me Up Scotty -->
		<script>
		const topButton = document.getElementById("backToTop");

		function onScroll() {
			const scrolled = window.scrollY > 10;
			document.body.classList.toggle("scrolled-ui", scrolled);

			topButton.classList.toggle("visible", window.scrollY > 200);
		}

		window.addEventListener("scroll", onScroll);
		onScroll();

		topButton.addEventListener("click", () => {
			window.scrollTo({
				top: 0,
				behavior: "smooth"
			});
		});
		</script>
		
		<!-- Ghost Scroll -->
		<script>
			const topbar = document.getElementById("topbar");
			
			function onScroll() {
				const active = window.scrollY > 10;
				document.body.classList.toggle("scrolled-ui", active);
			}

			window.addEventListener("scroll", onScroll);
			onScroll();
		</script>
		
		<!-- Page script: glue the floating back button under the current topbar button -->
		<script>
			(function () {
				const backBtn = document.getElementById('back-to-categories');

				function positionBackButton() {
					if (!backBtn) return;
					// find the current topbar button (the one with aria-current="page")
					const current = document.querySelector('#topbar .topbar-btn[aria-current="page"]');
					// If that's not found, fallback to first topbar-btn
					const anchor = current || document.querySelector('#topbar .topbar-btn');
					if (!anchor) return;

					// ensure backBtn has fixed positioning
					backBtn.style.position = 'fixed';
					backBtn.style.zIndex = 1202;

					// measure
					const aRect = anchor.getBoundingClientRect();
					const bRect = backBtn.getBoundingClientRect();

					// center under anchor, with slightly larger vertical gap so hover translate doesn't clip into topbar
					const left = Math.round(aRect.left + (aRect.width / 2) - (bRect.width / 2));
					const top = Math.round(aRect.bottom + 16); // was 8 -> now 16 (tiny bit lower)

					backBtn.style.left = left + 'px';
					backBtn.style.top = top + 'px';
				}

				// run on DOM ready and on resize; also run again shortly after load to catch late layout shifts
				window.addEventListener('DOMContentLoaded', () => {
					positionBackButton();
					// slight retry after fonts/images settle
					setTimeout(positionBackButton, 120);
				});
				window.addEventListener('load', () => setTimeout(positionBackButton, 120));
				window.addEventListener('resize', positionBackButton);
				// optional: observe layout changes to the topbar (e.g., if icons change)
				const topbar = document.getElementById('topbar');
				if (topbar && window.MutationObserver) {
					const mo = new MutationObserver(() => positionBackButton());
					mo.observe(topbar, { attributes: true, childList: true, subtree: true });
				}
			})();
		</script>
		
		<!-- Global JS -->
		<script src="../../custom/js/global.js" defer></script>
		
		<!-- Page script -->
		<script src="../../custom/js/router-filter.js" defer></script>
	</body>
</html>
