<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />

    <script src="../../../engine/js/image-fallbacks.js"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title>| Archive</title>
	<link rel="shortcut icon" type="image/x-icon" data-link="../custom/favicon.svg" />

	<link rel="stylesheet" href="../../custom/css/global.css" />
	<link rel="stylesheet" href="../../custom/css/corkboard.css" />

	<style>
		.readable-panel, .readable-panel * { color: #fff !important; }
		.content h1, h2, p { color: #fff !important; }
		
		/* ------------------------------------------------------------------
		   Archive Controls
		   ------------------------------------------------------------------ */

		/* Reader defaults */
		.readable-panel{
			color:#f2f2f2;
			font-family:"Lexend",sans-serif;
		}

		.readable-panel h1,
		.readable-panel h2,
		.readable-panel h3{
			color:#fff;
		}

		.archive-controls{
			display:flex;
			gap:10px;
			align-items:center;
			flex-wrap:wrap;
			flex:1;
		}

		.archive-count{
			margin-left:auto;
			font-size:0.95rem;
			opacity:.8;
		}

		.archive-item-wrapper{
			margin-top:12px;
		}


		/* ------------------------------------------------------------------
		   Shared Control Style
		   ------------------------------------------------------------------ */

		.frost-select,
		.page-size,
		.mark-read-menu .trigger{

			padding:8px 12px;

			border:1px solid rgba(255,255,255,.10);
			border-radius:8px;

			background:#272727;
			color:#fff;

			font:600 .95rem "Lexend",sans-serif;

			box-shadow:0 2px 8px rgba(0,0,0,.25);

			appearance:none;
			-webkit-appearance:none;
			-moz-appearance:none;

			transition:
				background .15s ease,
				border-color .15s ease,
				transform .15s ease;
		}

		.frost-select:hover,
		.page-size:hover,
		.mark-read-menu .trigger:hover{

			background:#323232;
			border-color:rgba(255,255,255,.18);
		}

		.frost-select:focus,
		.page-size:focus,
		.mark-read-menu .trigger:focus{

			outline:none;
			border-color:rgba(255,255,255,.35);
			box-shadow:
				0 0 0 2px rgba(255,255,255,.08),
				0 2px 8px rgba(0,0,0,.25);
		}


		/* ------------------------------------------------------------------
		   Blade Expansion
		   ------------------------------------------------------------------ */

		.blade .blade-text{
			display:-webkit-box;
			-webkit-line-clamp:3;
			-webkit-box-orient:vertical;

			overflow:hidden;

			max-height:calc(1.5em * 3 + 12px);

			transition:
				max-height 360ms cubic-bezier(.2,.9,.2,1),
				opacity 180ms ease;
		}

		.blade.expanded .blade-text{

			display:block;
			-webkit-line-clamp:unset;

			max-height:2000px;
		}

		.expand-btn.loading{
			opacity:.75;
			pointer-events:none;
			transform:none;
		}


		/* ------------------------------------------------------------------
		   Mark Read Menu
		   ------------------------------------------------------------------ */

		.mark-read-menu{
			position:relative;
			display:inline-block;
			margin-left:8px;
		}

		.mark-read-menu .menu{

			position:absolute;
			right:0;
			top:calc(100% + 8px);

			min-width:220px;

			display:none;
			z-index:1205;

			padding:6px;

			border:1px solid rgba(255,255,255,.08);
			border-radius:8px;

			background:#222;

			box-shadow:0 6px 18px rgba(0,0,0,.35);
		}

		.mark-read-menu[aria-expanded="true"] .menu{
			display:block;
		}

		.mark-read-menu .menu button{

			display:block;
			width:100%;

			padding:8px 10px;

			background:none;
			border:none;

			border-radius:6px;

			color:#fff;

			font:600 .95rem "Lexend",sans-serif;

			text-align:left;
			cursor:pointer;

			transition:background .15s ease;
		}

		.mark-read-menu .menu button:hover{
			background:#333;
		}


		/* ------------------------------------------------------------------
		   Checkbox
		   ------------------------------------------------------------------ */

		.filter-checkbox{

			--box-size:18px;

			display:inline-flex;
			align-items:center;
			gap:8px;

			cursor:pointer;
			user-select:none;
		}

		.filter-checkbox input[type="checkbox"]{

			appearance:none;
			-webkit-appearance:none;

			width:var(--box-size);
			height:var(--box-size);
			min-width:var(--box-size);

			border:1px solid rgba(255,255,255,.15);
			border-radius:6px;

			background:#252525;

			position:relative;

			cursor:pointer;

			transition:
				background .15s,
				border-color .15s;
		}

		.filter-checkbox input[type="checkbox"]:hover{

			border-color:rgba(255,255,255,.28);
		}

		.filter-checkbox input[type="checkbox"]:focus{

			outline:none;

			box-shadow:0 0 0 2px rgba(255,255,255,.08);
		}

		.filter-checkbox input[type="checkbox"]:checked{

			background:#4b6cb7;
			border-color:#4b6cb7;
		}

		.filter-checkbox input[type="checkbox"]:checked::after{

			content:"✓";

			position:absolute;

			left:3px;
			top:-1px;

			font-size:12px;
			font-weight:700;

			color:#fff;
		}


		/* ------------------------------------------------------------------
		   Pagination
		   ------------------------------------------------------------------ */

		.pagination{

			display:inline-flex;
			gap:8px;
			align-items:center;

			margin-left:10px;
		}

		.pagination button{

			min-width:44px;
		}


		/* ------------------------------------------------------------------
		   Bottom Controls
		   ------------------------------------------------------------------ */

		.outer-inner .bottom-controls{

			display:flex;
			justify-content:flex-end;
			align-items:center;

			margin-top:14px;
		}

		.outer-inner .bottom-controls .page-size{

			margin-right:12px;
		}


		/* ------------------------------------------------------------------
		   Responsive
		   ------------------------------------------------------------------ */

		@media (max-width:880px){

			.archive-controls{
				gap:8px;
			}

			.outer-inner .bottom-controls{
				justify-content:space-between;
			}
		}
		
		.board-header{
			display:flex;
			align-items:center;
			flex-wrap:wrap;
			gap:12px;
		}

		.archive-controls{
			display:flex;
			align-items:center;
			gap:10px;
			flex-wrap:wrap;
		}
		
		#topbar {
			position: fixed;
			top: 20px;
			left: 20px;
			display: flex;
			align-items: center;
			gap: 12px;
			z-index: 1000;
		}

		#topbar::before {
			content: "";
			position: absolute;
			inset: -10px;
			border-radius: 28px;

			background: rgba(0, 0, 0, 0.35);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);

			opacity: 0;
			transition: opacity 220ms ease;
			z-index: 0;
		}

		body.scrolled-ui #topbar::before {
			opacity: 1;
		}

		#topbar > * {
			position: relative;
			z-index: 1;
		}
		
		#infobar {
			position: fixed;
			top: 16px;
			right: 16px;
			display: flex;
			align-items: center;
			gap: 12px;
			z-index: 1001;
		}
		
		#infobar::before {
			content: "";
			position: absolute;
			inset: -10px;
			border-radius: 28px;

			background: rgba(0, 0, 0, 0.35);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);

			opacity: 0;
			transition: opacity 220ms ease;
			z-index: 0;
		}

		body.scrolled-ui #infobar::before {
			opacity: 1;
		}

		#infobar > * {
			position: relative;
			z-index: 1;
		}
		
		#infobar::before {
			inset: -8px;
			border-radius: 22px;
		}
		
		#topbar::before {
			box-shadow: 0 12px 30px rgba(0,0,0,0.25);
		}

		#infobar::before {
			box-shadow: 0 10px 24px rgba(0,0,0,0.22);
		}
		
		#backToTop {
			position: fixed;
			right: 20px;
			bottom: 60px;

			width: 64px;
			height: 64px;

			display: flex;
			align-items: center;
			justify-content: center;

			border: 1px solid var(--surface-border);
			border-radius: 999px;
			background: var(--surface-bg);

			backdrop-filter: var(--surface-backdrop);
			-webkit-backdrop-filter: var(--surface-backdrop);

			box-shadow: var(--surface-shadow);

			cursor: pointer;

			/* Hidden state */
			opacity: 0;
			transform: translateX(24px);
			pointer-events: none;

			transition:
				opacity .25s ease,
				transform .25s ease,
				background .18s ease,
				border-color .18s ease;

			z-index: 1000;
		}

		#backToTop.visible {
			opacity: 1;
			transform: translateX(0);
			pointer-events: auto;
		}

		#backToTop:hover {
			transform: translateX(0) translateY(-3px);
			background: var(--surface-hover-bg);
			border-color: var(--surface-hover-border);
		}

		#backToTop img {
			width: 32px;
			height: 32px;
			image-rendering: pixelated;
		}

		/* =
		   Tooltips
		   = */

		[data-tooltip]::before,
		.topbar-btn:hover[data-tooltip]::before,
		.infobar-btn:hover[data-tooltip]::before {
			font-family: "Lexend", sans-serif;
		}

		/* =
		   Navigation Buttons
		   = */

		.topbar-btn:hover {
			transform: translateY(-2px);

			background: rgba(255,255,255,0.20);
			border-color: rgba(255,255,255,0.48);

			box-shadow: 0 14px 36px rgba(0,0,0,0.24);
		}
		
		.panel-glyph {
			width: 32px;
			height: 32px;
			margin-right: .4rem;
			vertical-align: middle;
		}

		/* =
		   Footer
		   = */

		.footer-wrapper {
			position: fixed;

			right: 64px;
			bottom: 0;

			display: flex;
			justify-content: flex-end;
			align-items: flex-end;

			width: auto;
			height: 128px;

			overflow: hidden;

			pointer-events: none;

			z-index: 4;

			font-family: "Lexend", sans-serif;
		}

		.footer-box {
			display: inline-block;

			padding: 8px 12px;

			border: 1px solid rgba(255,255,255,0.06);
			border-radius: 12px 12px 0 0;

			background: rgba(7,12,20,0.36);

			backdrop-filter: blur(6px) saturate(110%);
			-webkit-backdrop-filter: blur(6px) saturate(110%);

			box-shadow: 0 8px 22px rgba(0,0,0,0.45);

			color: #fff;
			font-size: 0.92em;
			white-space: nowrap;

			pointer-events: auto;

			transition: transform 320ms ease;
		}

		.footer-heart,
		.footer-name {
			display: inline-block;

			color: #ff984a;

			transform-origin: center;
			will-change: transform, color;

			animation: footerPulse 1.6s ease-in-out infinite;
		}

		.footer-name {
			margin-left: 6px;
			animation-duration: 1.9s;
		}
		
		@keyframes footerPulse {
			0% {
				transform: scale(1);
				color: #ff9a4a;
			}

			45% {
				transform: scale(1.04);
				color: #ff7a2e;
			}

			100% {
				transform: scale(1);
				color: #ff9a4a;
			}
		}

		/* =
		   Animations
		   = */

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(18px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* =
		   Reduced Motion
		   = */

		@media (prefers-reduced-motion: reduce) {

			.footer-heart,
			.footer-name {
				animation: none;
			}

			.story-btn,
			.topbar-btn {
				transition: none;
			}
		}

		/* =
		   Mobile
		   = */

		@media (max-width: 700px) {

			.footer-wrapper {
				right: 12px;
				height: 84px;
			}

			.footer-box {
				margin-bottom: -30px;

				padding: 6px 10px;

				border-radius: 10px 10px 0 0;
			}
			
		}
        </style>
	<link rel="stylesheet" href="../../../engine/css/accessible-fonts.css" />
	<script src="../../../engine/js/font-accessibility.js" defer></script>
</head>

<body>
	<!-- Background -->
	<div id="background">
		<div class="bg-layer" id="bg1"></div>
		<div class="bg-layer" id="bg2"></div>
	</div>
	
	<!-- Top-left navigation -->
        <nav id="topbar" aria-label="Primary">
			<!-- Home Button disabled -->
			<button
				class="topbar-btn"
				aria-label="Home"
				disabled
			>
				<img data-src="custom/img/side-home.png" alt="Home" />
            </button>
			
			<div class="topbar-sep" aria-hidden="true"></div>
			
			<!-- Stories -->
            <button
				class="topbar-btn"
				aria-label="Writing"
				disabled
			>
                <img data-src="../../custom/img/collections.svg" alt="Writing" />
            </button>
			
			<div class="topbar-sep" style="height: 20px" aria-hidden="true"></div>
			
			<!-- Virtual Corkboard -->
            <button
				class="topbar-btn"
				aria-label="Corkboard"
				aria-current="page"
				disabled
			>
                <img data-src="./custom/img/corkboard.svg" alt="Corkboard" />
            </button>
			
            <div class="topbar-sep" aria-hidden="true"></div>
			
			<!-- Modding Guide Mass Effect -->
			<button
				class="topbar-btn"
				style="width: 128px"
				aria-label="MWBC"
				disabled
			>
				<img data-src="custom/img/logo-bare-flat.png" style="width: 128px; image-rendering: auto" alt="MWBC" />
            </button>
			
		</nav>
		
	<!-- Back button -->
	<a href="../landing_corkboard.html"
		id="back-to-categories"
		class="topbar-back-btn"
		data-tooltip="Back to Categories"
		aria-label="Back to Categories"
		title="Back to Categories">
		<span class="back-text" style="font-family: 'Lexend'" aria-hidden="false">Return to Corkboard</span>
	</a>

	<main class="content">
		<div class="readable-panel">
			<h1><img src="../../custom/img/glyph.svg" style="width: 32px; height: 32px" /> The Cork-ive</h1>
			<p>An archive of every thought, update or interesting bookmark.<br> 
			Filter by category or sort via the controls below.</p>
		</div>

		<div class="readable-panel outer-board">
			<div class="outer-inner">
				<div class="board-header">
					
					<!-- Mark as read: Aside from the horrendous frosted look it actually works 
					-->
					<div class="mark-read-menu" id="mark-read-menu" aria-expanded="false">
						<button id="mark-read-trigger" class="trigger" aria-haspopup="true" aria-expanded="false">Mark as Read… ▾</button>
						<div class="menu" role="menu" aria-label="Mark as read options">
							<button data-action="visible" role="menuitem">Mark visible</button>
							<button data-action="all" role="menuitem">Mark all (entire archive)</button>
							<div style="height:1px;background:rgba(255,255,255,0.24);border-radius:2px;"></div>
							<button data-action="thought" role="menuitem">Mark thoughts (entire archive)</button>
							<button data-action="bookmark" role="menuitem">Mark bookmarks (entire archive)</button>
							<button data-action="update" role="menuitem">Mark updates (entire archive)</button>
						</div>
					</div>
					
					<!-- The filters all work actually
						 Pagination and page size works as well
						 The unread counter works as well
					-->
					<div class="archive-controls" aria-hidden="false">
						<label>
							<select id="filter-category" class="frost-select" aria-label="Filter by category">
								<option value="all">All</option>
								<option value="thought">Thoughts</option>
								<option value="bookmark">Bookmarks</option>
								<option value="update">Updates</option>
							</select>
						</label>

						<label>
							<select id="sort-mode" class="frost-select" aria-label="Sort mode">
								<option value="newest">Newest → Oldest</option>
								<option value="oldest">Oldest → Newest</option>
								<option value="alpha">Alphabetical (title/content)</option>
							</select>
						</label>

						<label class="filter-checkbox" title="Show unread only">
							<input id="filter-unread" type="checkbox" />
							<span style="font-size:0.95rem;">Show unread only</span>
						</label>

						<label>
							<select id="page-size" class="page-size" title="Items per page" aria-label="Items per page">
								<option value="10">10 / page</option>
								<option value="20">20 / page</option>
								<option value="50">50 / page</option>
							</select>
						</label>

						<div class="pagination" aria-hidden="false">
							<button id="page-prev" class="settings-btn" type="button" aria-label="Previous page">&larr;</button>
							<div id="page-indicator" class="small muted" aria-live="polite">1 / 1</div>
							<button id="page-next" class="settings-btn" type="button" aria-label="Next page">&rarr;</button>
						</div>

						<!-- archive-count (uncommented and enhanced) - Works, surprisingly
						-->
						<div class="archive-count" aria-live="polite">
							<span id="archive-count">Loading…</span>
						</div>
					</div>
				</div>
				
				<div id="archive-stream" style="margin-top:12px;">
					<!-- blades injected here -->
				</div>

				<!-- bottom controls mirror (right corner) -->
				<div class="bottom-controls" aria-hidden="false">
					<div>
						<label>
							<select id="page-size-bottom" class="page-size" title="Items per page" aria-label="Items per page">
								<option value="10">10 / page</option>
								<option value="20">20 / page</option>
								<option value="50">50 / page</option>
							</select>
						</label>
						<div class="pagination">
							<button id="page-prev-bottom" class="settings-btn" type="button" aria-label="Previous page (bottom)">&larr;</button>
							<div id="page-indicator-bottom" class="small muted" aria-live="polite">1 / 1</div>
							<button id="page-next-bottom" class="settings-btn" type="button" aria-label="Next page (bottom)">&rarr;</button>
						</div>
					</div>
				</div>

			</div>
		</div>
	</main>

		<!-- Infobar (top-right) -->
        <nav id="infobar" aria-label="Site utilities">
			<!-- Settings button -->
            <button
                id="settings-toggle"
                class="infobar-btn"
                aria-expanded="false"
                aria-controls="time-of-day-menu"
                data-tooltip="Time of day"
                >
                <img data-src="./custom/img/bottom-gear.png" alt="Time of day" id="settings-icon" />
            </button>
			
			<div class="infobar-sep" style="height: 20px" aria-hidden="true"></div>
			
			<!-- Credits Button -->
            <button
                id="info-toggle"
                class="infobar-btn"
                aria-expanded="false"
                aria-controls="info-popup"
                data-tooltip="Info"
                >
                <img data-src="./custom/img/bottom-info.png" alt="Info" id="info-icon" />
            </button>
            
			<div class="infobar-sep" aria-hidden="true"></div>
			
			<!-- Social Button -->
            <a id="social-link" class="infobar-btn" href="https://bsky.app/profile/varkorax.bsky.social" aria-label="Visit Varkorax on Bluesky" data-tooltip="Socials"><img data-src="custom/img/socials.svg" alt="Socials" id="notif-icon" /></a>
			
        </nav>
		
	<!-- SETTINGS POPUP (inlined) -->
	

	<!-- INFO POPUP (inlined) -->
	<div id="info-popup" class="popup" role="dialog" aria-hidden="true" aria-label="Info panel" aria-modal="true">
		<div class="popup-inner">
			<button class="popup-start visually-hidden" aria-label="Start of info dialog">Start info</button>
			<button class="popup-close" aria-label="Close info panel">✕</button>

			<div class="popup-content">
				<!-- IFRAME: info page -->
				<iframe
					src="../info.html"
					title="Info"
					style="display:block; width:100%; height:100%; min-height:320px; border:0;"
					allow="clipboard-read; clipboard-write; geolocation; microphone; camera; autoplay"
					></iframe>

				<noscript>
					<div class="content small">
						<p>JavaScript is required to load the info panel. <a class="bare-link" href="../info.html">Open info</a></p>
					</div>
				</noscript>
			</div>

			<p class="popup-help">To close the window or press Escape.</p>
		</div>
	</div>

	<div id="toast-container" aria-live="polite" aria-atomic="true"></div>
	
	<!-- Foot Adjacent Back To Top -->
		<button id="backToTop" aria-label="Back to top">
			<img src="../../custom/img/top.svg" alt="" />
		</button>
		
		<!-- Footer Footer Footer Footlong -->
		<div class="footer-wrapper" aria-hidden="false">
			<div class="footer-box" role="contentinfo">
				Made with <span class="footer-heart">♥</span> by<span class="footer-name"><a href="https://www.youtube.com/watch?v=Q2vA4Ue4Ths" target="_blank" rel="noopener" style="color:inherit; text-decoration:none;">Varkorax</a></span>
			</div>
		</div>
		
		<!-- Beam Me Up Scotty -->
		<script src="../../../engine/js/pages/varkorax-archive-pages-corkboard-archive-1.js"></script>
		
		<!-- Ghost Scroll -->
		<script src="../../../engine/js/pages/varkorax-archive-pages-corkboard-archive-2.js"></script>
	
	<!-- marked for markdown -->
